      - pushd /tmp/build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv /tmp/build org.buetow.turbolaunch
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - mv org.buetow.turbolaunch /tmp/build
      - pushd /tmp/build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
      - popd
      - mv /tmp/build org.buetow.turbolaunch

  - versionName: 0.1.0
    versionCode: 13
    commit: v0.1.0
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    binary: https://github.com/snonux/turbolaunch/releases/download/v%v/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(cat .flutter-version)
