Categories:
  - System
  - Theming
License: MIT
AuthorName: Paul Buetow
AuthorEmail: paul@buetow.org
AuthorWebSite: https://foo.zone
SourceCode: https://github.com/snonux/turbolaunch
IssueTracker: https://github.com/snonux/turbolaunch/issues
Changelog: https://github.com/snonux/turbolaunch/releases

AutoName: TurboLaunch

RepoType: git
Repo: https://github.com/snonux/turbolaunch.git

Builds:
  - versionName: 0.1.0
    versionCode: 11
    commit: v0.1.0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/snonux/turbolaunch/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - cd ..
      - mv org.buetow.turbolaunch /tmp/build
      - pushd /tmp/build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv /tmp/build org.buetow.turbolaunch
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - mv org.buetow.turbolaunch /tmp/build
      - pushd /tmp/build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv /tmp/build org.buetow.turbolaunch

  - versionName: 0.1.0
    versionCode: 12
    commit: v0.1.0
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
